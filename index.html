<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="./assets/styles/index.css">
  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <title>Frontend Mentor | Interactive rating component</title>
</head>
<body>

  <!-- Rating state start -->
  <section class="content">
    <img src="./assets/images/icon-star.svg" alt="icon_star" class="star">
    <h1 class="title">
      How did we do?
    </h1>
    <p>
      Please let us know how we did with your support request. All feedback is appreciated 
      to help us improve our offering!
    </p>
    <ul class="option">
      <li value="1" class="option_number"><strong>1</strong></li>
      <li value="2" class="option_number"><strong>2</strong></li>
      <li value="3" class="option_number"><strong>3</strong></li>
      <li value="4" class="option_number"><strong>4</strong></li>
      <li value="5" class="option_number"><strong>5</strong></li>
    </ul>
    <button type="submit" class="submit">
      <strong>S U B M I T</strong>
    </button>
  </section>

  <script src="assets/JS/index.js"></script>
</body>
</html>
